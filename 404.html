<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda no encontrada — ProductSpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d2240 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .card { position: relative; }
    .card::before {
      content: "";
      position: absolute;
      top: -140px; left: 50%;
      transform: translateX(-50%);
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(233,69,96,.16) 0%, transparent 65%);
      pointer-events: none;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 40px; position: relative; }
    .brand-wordmark { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.02em; font-size: 1.25rem; color: #f8fafc; }
    .brand-wordmark em { font-style: normal; color: #e94560; }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      display: block;
      position: relative;
    }
    h1 { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; position: relative; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 32px; font-size: .95rem; position: relative; }
    .btn {
      display: inline-block;
      background: #e94560;
      color: #fff;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .95rem;
      transition: background .2s cubic-bezier(.22,1,.36,1), transform .2s cubic-bezier(.22,1,.36,1);
      position: relative;
    }
    .btn:hover { background: #c22844; transform: translateY(-1px); }
    .slug { color: #ffb454; font-family: monospace; word-break: break-all; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand">
      <svg width="30" height="30" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="9" fill="#f8fafc"/>
        <rect x="2" y="34" width="28" height="28" rx="9" fill="#f8fafc"/>
        <rect x="34" y="34" width="28" height="28" rx="9" fill="#f8fafc"/>
        <circle cx="48" cy="16" r="14" fill="#e94560"/>
      </svg>
      <span class="brand-wordmark">Product<em>Spot</em></span>
    </span>
    <span class="icon">🔍</span>
    <h1>Tienda no encontrada</h1>
    <p>
      El catálogo <span class="slug" id="slugDisplay"></span> no existe o fue eliminado.
      Verifica el enlace o visita nuestra página principal.
    </p>
    <a href="landing.html" class="btn">Ir a ProductSpot →</a>
  </div>
  <script>
    const slug = new URLSearchParams(window.location.search).get('s');
    const el = document.getElementById('slugDisplay');
    if (slug && el) el.textContent = `"${slug}"`;
    else if (el) el.parentElement.innerHTML = el.parentElement.innerHTML.replace(
      'El catálogo <span class="slug" id="slugDisplay"></span> no existe o fue eliminado.',
      'Este catálogo no existe o fue eliminado.'
    );
  </script>
</body>
</html>
